name: Android CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_call: # release.yml runs these checks before shipping.

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Write google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.TIB_KEYBOARD_GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "::error::Repository secret TIB_KEYBOARD_GOOGLE_SERVICES_JSON is empty or missing (base64 of app/google-services.json)."
            exit 1
          fi
          echo "$GOOGLE_SERVICES_JSON" | base64 --decode > app/google-services.json

      - run: chmod +x ./gradlew

      # Lint is red at baseline (deliberate UseAppTint errors), so it is not a gate.
      - name: Build debug APK and run unit tests
        run: ./gradlew :app:assembleDebug :botok:test :app:testDebugUnitTest --no-daemon --stacktrace
